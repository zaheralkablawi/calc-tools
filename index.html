const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const K='ct_k_'+D.s.slice(0,8);
async function dec(raw){
  const key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(D.i)},key,u(D.c));
  const html=new TextDecoder().decode(pt);
  document.open(); document.write(html); document.close();
}
async function derive(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:u(D.s),iterations:D.n,hash:'SHA-256'},base,256));
}
async function start(){
  let saved=null; try{ saved=localStorage.getItem(K); }catch(e){}
  if(saved){ try{ await dec(u(saved)); return; }catch(e){ try{localStorage.removeItem(K);}catch(_){} } }
  document.getElementById('g').style.display='flex';
  document.getElementById('f').onsubmit=async ev=>{ ev.preventDefault(); const e=document.getElementById('e'); e.textContent='...';
    try{ const raw=await derive(document.getElementById('p').value); try{ localStorage.setItem(K, btoa(String.fromCharCode(...raw))); }catch(_){} await dec(raw); }

}
if(document.readyState==='complete') start(); else window.addEventListener('load', start);
